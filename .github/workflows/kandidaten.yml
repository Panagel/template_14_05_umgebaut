name: Kandidatensuche

on:
  workflow_dispatch:

jobs:
  kandidaten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Haendler suchen
        run: node kandidaten.js
