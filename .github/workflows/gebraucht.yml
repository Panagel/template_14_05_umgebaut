name: H2D-Gebrauchtmarkt

on:
  schedule:
    # taeglich 06:10 UTC, nach dem Preisscan um 05:35 - beide committen in
    # dasselbe Repo, so kommen sie sich nicht in die Quere.
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      bericht:
        description: 'Wochenbericht erzwingen (auch wenn nicht Montag)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h2d-gebraucht
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kleinanzeigen abfragen
        run: node gebraucht/scan.js

      - name: Kalkulation
        run: node gebraucht/kalkulation.js

      - name: Wochentag ermitteln
        id: dow
        run: echo "day=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Wochenbericht erzeugen
        id: bericht
        if: steps.dow.outputs.day == '1' || github.event.inputs.bericht == 'true'
        run: |
          node gebraucht/report.js > /dev/null
          echo "erzeugt=ja" >> "$GITHUB_OUTPUT"

      - name: Ergebnisse committen
        run: |
          git config user.name "h2d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A gebraucht/data gebraucht/berichte
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Gebrauchtmarkt $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      - name: Sofortmeldung guenstige Combo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node gebraucht/alarm.js

      - name: Push-Benachrichtigung
        if: steps.bericht.outputs.erzeugt == 'ja'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node gebraucht/notify.js

      - name: Warnung bei Fehlschlag
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="H2D-Gebrauchtmarkt fehlgeschlagen. Moeglicherweise blockiert Kleinanzeigen die GitHub-Runner oder die Seitenstruktur hat sich geaendert. Lauf: $LAUF"
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$TEXT" \
              -o /dev/null || true
          fi
          if [ -n "$NTFY_TOPIC" ]; then
            curl -sS -H "Title: H2D-Gebrauchtmarkt fehlgeschlagen" -H "Priority: high" -H "Tags: warning" \
              -d "$TEXT" "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
