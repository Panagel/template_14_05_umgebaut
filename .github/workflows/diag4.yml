name: Vierte Diagnose

on:
  workflow_dispatch:

jobs:
  diag4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Umleitung und Haendler pruefen
        run: node diag4.js
