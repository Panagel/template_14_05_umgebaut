name: Region- und Haendlerdiagnose

on:
  workflow_dispatch:

jobs:
  diag3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Region und Haendler pruefen
        run: node diag3.js
