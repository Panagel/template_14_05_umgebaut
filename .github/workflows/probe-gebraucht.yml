name: Probe Gebrauchtmarkt (temporaer)
on:
  push:
    branches: [ccr-c2cf7694-ouhzwa]
    paths: ['gebraucht/probe.js', '.github/workflows/probe-gebraucht.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node gebraucht/probe.js
